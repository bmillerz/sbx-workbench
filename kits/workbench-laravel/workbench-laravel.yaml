# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: set
displayName: Laravel workbench
description: >-
  The Laravel workbench with Claude Code and headless Chromium, pinned
  together as one reference: workbench-laravel-base, Docker's Claude Code
  mixin and Docker's Playwright mixin.
sourceUrl: https://github.com/bmillerz/sbx-workbench/tree/main/kits/workbench-laravel

# The set's own release. Bump it whenever any pin below moves.
version: "2.0.0"

args:
  # Where workbench-laravel-base was pushed. A build-phase arg, so a test
  # build can point at a throwaway localhost:5000 registry.
  registry:
    default: docker.io/bmillerz
    pattern: '^[a-z0-9][a-z0-9._/:-]*$'
    description: Registry namespace workbench-laravel-base was pushed to
    buildArg: KIT_REGISTRY

# Publishing pins each by digest. Order carries no meaning; the base's
# `requires: ["claude"]` is what puts the claude mixin ahead of it.
kits:
  - ref: ${{ kit.args.registry }}/workbench-laravel-base:2.0.0
  - ref: docker.io/docker/sbx-kit-claude-mixin:2.1.292
  - ref: docker.io/docker/sbx-kit-playwright:1.61.1
