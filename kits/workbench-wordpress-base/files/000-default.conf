# The workspace path is only known at create, so the vhost serves a symlink
# `devup` points at the project (or: sudo ln -sfn "$PWD" /var/www/html).
# ponytail: FollowSymLinks + AllowOverride so WP permalinks work via .htaccess.
<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /var/www/html
  <Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>
