# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: WordPress workbench (base)
description: >-
  PHP 8.5, Apache, MariaDB, Redis, Composer and wp-cli on Docker's Ubuntu
  shell template, with the services started and the docroot pointed at the
  workspace at every boot. Ships no agent: compose it with
  docker/sbx-kit-claude-mixin, or use the workbench-wordpress set.
sourceUrl: https://github.com/bmillerz/sbx-workbench/tree/main/kits/workbench-wordpress-base

# The kit's own release, and the tag it publishes under. Bump it when the
# recipe or these declarations change — never rebuild a published tag.
version: "2.0.1"

# The image's ENTRYPOINT launches `claude`, which only a claude kit supplies.
# Requiring it makes a composition without one fail at create, not at launch.
requires: ["claude"]

capabilities:
  # An agent sandbox: sbx launches the ENTRYPOINT as the agent rather than
  # as PID 1, and honours the image's `agent` user.
  - type: com.docker.sandbox/sbx@1

  # The site keeps serving after the last session detaches.
  - type: com.docker.sandbox/long-running@1

  # v3 only hands the host's git user.name/email to kits that ask, and the
  # claude mixin doesn't. Optional, so a host without an identity still
  # starts — commits then fail until one is set in the sandbox.
  - type: com.docker.sandbox/git-identity@1
    description: Attribute commits to the user's Git identity
    optional: true

  # Steady-state egress for the work this image exists for. An absent phase
  # grants nothing, and startup hooks run in the runtime phase.
  #   wordpress.org       core, plugin and theme downloads; update checks
  #   packagist + GitHub  composer-managed sites (Bedrock and friends)
  #   npm                 theme build tooling
  #   Ubuntu, Docker, gh  every apt source the base configures — `apt-get
  #                       update` fails if any one is unreachable, and the
  #                       claude mixin runs one in the background each boot.
  #                       ports.ubuntu.com is arm64, the other two amd64.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - wordpress.org
          - api.wordpress.org
          - downloads.wordpress.org
          - packagist.org
          - repo.packagist.org
          - github.com
          - api.github.com
          - codeload.github.com
          - objects.githubusercontent.com
          - registry.npmjs.org
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com
          - cli.github.com

  # The kit names the container port; the host side is the user's choice
  # (`ports:` in sbxenv.yaml), otherwise an ephemeral port.
  - type: com.docker.sandbox/port@1
    description: Apache
    config: {name: http, container: 80}

  # No init in a sandbox, so apt's services come up installed-but-stopped.
  # Stable sbx runs startup hooks alongside the agent rather than before it.
  # WORKSPACE_DIR is declared because hook environments are deny-by-default
  # and devup reads it to find the docroot.
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: /usr/local/bin/devup
          user: agent
          env: [WORKSPACE_DIR]
          description: Start MariaDB, Redis and Apache, and point the docroot at the workspace

  # A body only: the claude mixin owns the CLAUDE.md profile this lands in.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./workbench-wordpress-base-context.md
